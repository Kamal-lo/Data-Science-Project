services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: p3_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15

  p3-rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p3_rag_api
    ports:
      - "8003:8000"
    environment:
      QDRANT_MODE: remote
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-entreprise_corpus}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence_transformer}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-intfloat/multilingual-e5-base}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-hybrid}
      RERANKER_MODEL_NAME: ${RERANKER_MODEL_NAME:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_storage:
  hf_cache:
